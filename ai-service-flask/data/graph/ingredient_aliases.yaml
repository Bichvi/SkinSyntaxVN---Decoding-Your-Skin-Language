# Common ingredient spellings -> canonical INCI key (graph_sync.ingredients).
# Shape: ingredients: { <canonical_key>: { inci, name_vi?, role?, aliases: [...] } }
# Variants are compared after slugify. Unlisted ingredients still get a key (slug of the
# raw name) with inci = null and are counted in the ETL report ("top unmapped").
# role: active | uv_filter | humectant | emollient | base | preservative | fragrance
#   base/preservative/fragrance/emollient are excluded from "shared actives" (SIMILAR_TO.shared).
# Selection: the ~200 most frequent names in san_pham.thanh_phan_full / thanh_phan_sach
# (2026-10-21 snapshot) + Vietnamese names seen in thanh_phan_sach. INCI spelling: EU CosIng.

