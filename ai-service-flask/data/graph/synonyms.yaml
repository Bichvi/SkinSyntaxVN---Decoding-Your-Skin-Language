# Synonym groups for graph keys (docs/neo4j/schema.md, rule step 6).
# Shape: <group>: { <canonical_key>: { name: <display>, aliases: [<variant>, ...] } }
# Variants are compared after slugify (lower, no accents, non-alnum -> "_"), so
# "Sữa Rửa Mặt", "sua rua mat" and "SỮA-RỬA-MẶT" are the same variant.
# A variant must not appear in two groups (enforced by tests/graph_sync/test_normalize.py).
# Caveat: accents are stripped, so "mắt" (eye) == "mặt" (face) -> avoid such aliases.
# Reused by Bước 04 (intent parser): add user phrasings here, not in code.

