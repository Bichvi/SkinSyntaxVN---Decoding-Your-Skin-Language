name: skinsyntax

x-ai-idol-common: &ai-idol-common
  build:
    context: .
    dockerfile: Dockerfile.ai-idol
  image: skinsyntax-ai-idol:local
  restart: unless-stopped
  env_file:
    - .env
  environment: &ai-idol-environment
    MONGO_URI: ${MONGO_URI}
    MONGO_DB: ${MONGO_DB:-skinsyntax}
    MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
    AI_IDOL_REDIS_URL: redis://redis:6379/2
    AI_IDOL_CHROMA_HOST: chromadb
    AI_IDOL_CHROMA_PORT: "8000"
    AI_IDOL_AGENT_ENABLED: "true"
    AI_IDOL_AGENT_ALLOW_AUTO_PUBLISH: "false"
    AI_IDOL_SCRIPT_COUNCIL_ENABLED: "true"
    AI_IDOL_SCRIPT_COUNCIL_URL: http://ai-idol-agent-service:5013
    AI_IDOL_INTERNAL_TOKEN: "${AI_IDOL_INTERNAL_TOKEN:-}"
    AI_IDOL_AVATAR_SERVICE_URL: http://host.docker.internal:7861
    SYNA_RENDER_URL: http://host.docker.internal:7862
  volumes:
    - ai_idol_storage:/app/storage
    - ./ai-idol-service/assets/music:/app/assets/music:ro
  depends_on:
    mongodb:
      condition: service_healthy
    chromadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - skinsyntax-net

services:

  mongodb:
    image: mongo:7
    container_name: skinsyntax-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: skinsyntax
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "localhost:27017/test", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s
    networks:
      - skinsyntax-net

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: skinsyntax-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skinsyntax-net

  neo4j:
    image: neo4j:5.26-community
    container_name: skinsyntax-neo4j
    restart: unless-stopped
    mem_limit: 1g
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - skinsyntax-net

  redis:
    image: redis:7-alpine
    container_name: skinsyntax-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skinsyntax-net

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: skinsyntax-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      CHATBOT_PORT: "5001"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_WORKER_CLASS: "gthread"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # Local fallback for non-Docker runs; Docker uses the Chroma service above.
      CHROMA_DB_PATH: /app/database/chroma_db
      CSV_FILE_PATH: /app/database/data_clean_final.csv
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-skinsyntax}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "604800"
      SESSION_CACHE_TTL: "3600"
      PYTHONPATH: "/app:/app/chatbot_service"
      # Neo4j is optional for Flask: no healthy dependency, search degrades if down.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      # Smart search mode B (Bước 05B): graph branches on; Neo4j down -> degraded, never 5xx.
      SEARCH_GRAPH_ENABLED: "${SEARCH_GRAPH_ENABLED:-true}"
      # Bước 08: boost "thường mua cùng" (CO_PURCHASED, cần graph_sync --derive co_purchase). Mặc định tắt.
      SEARCH_CO_PURCHASE_ENABLED: "${SEARCH_CO_PURCHASE_ENABLED:-false}"
    volumes:
      - ./database:/app/database:ro
      - ./ai-service-flask:/app
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - skinsyntax-net

  ai-idol-agent-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-idol-agent
    image: skinsyntax-ai-idol-agent:local
    container_name: skinsyntax-ai-idol-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_IDOL_CREW_PORT: "5013"
      AI_IDOL_GROQ_MODEL: "${AI_IDOL_GROQ_MODEL:-openai/gpt-oss-20b}"
      AI_IDOL_CREW_REVIEW_MODEL: "${AI_IDOL_CREW_REVIEW_MODEL:-openai/gpt-oss-20b}"
      AI_IDOL_CREW_MAX_TOKENS: "${AI_IDOL_CREW_MAX_TOKENS:-650}"
      AI_IDOL_CREW_MAX_RPM: "${AI_IDOL_CREW_MAX_RPM:-4}"
      AI_IDOL_INTERNAL_TOKEN: "${AI_IDOL_INTERNAL_TOKEN:-}"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5013/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - skinsyntax-net

  ai-idol-service:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol
    ports:
      - "127.0.0.1:5003:5003"
    command: ["gunicorn", "--bind", "0.0.0.0:5003", "--workers", "1", "--threads", "4", "--timeout", "120", "app:app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s

  ai-idol-worker:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-worker
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=media,celery"]

  ai-idol-control-worker:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-control
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=control,agent"]

  ai-idol-broadcast-worker:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-broadcast
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=broadcast"]

  ai-idol-beat:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-beat
    command: ["celery", "-A", "celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/ai-idol-celerybeat-schedule"]

  php-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: skinsyntax-php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-skinsyntax}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
      DB_MODE: ${DB_MODE:-atlas}
      DOCKER_USE_ATLAS: "1"
      FRONTEND_ROOT: /var/www/frontend
      APP_URL: ${APP_URL:-http://localhost}
      AI_CHAT_ENDPOINT: http://ai-service:5001/api/chat/auto
      AI_CHAT_STREAM_ENDPOINT: http://ai-service:5001/api/chat/stream
      AI_RECOMMENDATION_ENDPOINT: http://ai-service:5001/api/recommend/explain
      AI_HYBRID_RECOMMENDATION_ENDPOINT: http://ai-service:5001/api/recommend/langchain-rag
      # Trước đây thiếu biến này nên PHP gọi 127.0.0.1:5002 (không tồn tại trong container).
      AI_LLAMA_INDEX_RECOMMENDATION_ENDPOINT: http://ai-service:5001/api/recommend/profile
      # Smart Search Bước 06 (PHP -> Flask). Không đặt trong .env để khỏi bị .env (127.0.0.1) ghi đè.
      SEARCH_RECOMMEND_ENDPOINT: http://ai-service:5001/api/search/recommend
      SEARCH_BREAKER_REDIS_URL: redis://redis:6379/0
      # Trang goiy dùng engine PHP; bật "1" để chờ thêm AI RAG (~10s/lần, có cache session).
      AI_GOIY_SYNC_AI: "${AI_GOIY_SYNC_AI:-0}"
      AI_CHAT_TIMEOUT: "60"
      AI_RECOMMENDATION_TIMEOUT: "20"
      AI_HYBRID_RECOMMENDATION_TIMEOUT: "30"
      AI_IDOL_ENDPOINT: http://ai-idol-service:5003
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "604800"
      CACHE_DRIVER: ${CACHE_DRIVER:-valkey}
      VALKEY_URL: ${VALKEY_URL:-}
      CACHE_PREFIX: ${CACHE_PREFIX:-skinsyntax:}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-300}
      MAIL_DEMO_MODE: "1"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/frontend:ro
      - ./database:/var/www/database:ro
      - ./.env:/var/www/.env:ro
      # Pool PHP-FPM lớn hơn (xem docker/php/zz-skinsyntax-fpm.conf); Dockerfile.php cũng COPY file này vào image.
      - ./docker/php/zz-skinsyntax-fpm.conf:/usr/local/etc/php-fpm.d/zz-skinsyntax-fpm.conf:ro
      # Opcache ít kiểm tra timestamp hơn (xem docker/php/zz-skinsyntax-opcache.ini)
      - ./docker/php/zz-skinsyntax-opcache.ini:/usr/local/etc/php/conf.d/zz-skinsyntax-opcache.ini:ro
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
      ai-idol-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skinsyntax-net

  nginx:
    image: nginx:1.27-alpine
    container_name: skinsyntax-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/var/www/html/public:ro
      - uploads_data:/var/www/html/public/uploads:ro
    depends_on:
      - php-backend
    networks:
      - skinsyntax-net

  voice-service:
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    container_name: skinsyntax-voice
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      TTS_PORT: "5002"
      NUM_THREADS: "4"
      PRECISION: "int8"
    volumes:
      - vieneu_model_cache:/root/.cache/huggingface
    networks:
      - skinsyntax-net

  livekit-voice-agent:
    build:
      context: ./livekit-voice-agent
      dockerfile: Dockerfile
    container_name: skinsyntax-livekit-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      AI_SERVICE_URL: http://ai-service:5001/api/chat/auto
      TTS_SERVICE_URL: http://voice-service:5002/api/tts/stream
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - voice-service
      - ai-service
      - redis
    networks:
      - skinsyntax-net

volumes:
  mongo_data:
    name: skinsyntax-mongo-data
  chroma_data:
    name: skinsyntax-chroma-data
  uploads_data:
    name: skinsyntax-uploads
  redis_data:
    name: skinsyntax-redis-data
  vieneu_model_cache:
    name: skinsyntax-vieneu-model-cache
  ai_idol_storage:
    name: skinsyntax-ai-idol-storage
  neo4j_data:
    name: skinsyntax-neo4j-data
  neo4j_logs:
    name: skinsyntax-neo4j-logs

networks:
  skinsyntax-net:
    name: skinsyntax-network
    driver: bridge

