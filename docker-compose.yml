name: skinsyntax

x-ai-idol-common: &ai-idol-common
  build:
    context: .
    dockerfile: Dockerfile.ai-idol
  image: skinsyntax-ai-idol:local
  restart: unless-stopped
  env_file:
    - .env
  environment: &ai-idol-environment
    MONGO_URI: ${MONGO_URI}
    MONGO_DB: ${MONGO_DB:-skinsyntax}
    MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
    AI_IDOL_REDIS_URL: redis://redis:6379/2
    AI_IDOL_CHROMA_HOST: chromadb
    AI_IDOL_CHROMA_PORT: "8000"
    AI_IDOL_AGENT_ENABLED: "true"
    AI_IDOL_AGENT_ALLOW_AUTO_PUBLISH: "false"
    AI_IDOL_SCRIPT_COUNCIL_ENABLED: "true"
    AI_IDOL_SCRIPT_COUNCIL_URL: http://ai-idol-agent-service:5013
    AI_IDOL_INTERNAL_TOKEN: "${AI_IDOL_INTERNAL_TOKEN:-}"
    AI_IDOL_AVATAR_SERVICE_URL: http://host.docker.internal:7861
    SYNA_RENDER_URL: http://host.docker.internal:7862
  volumes:
    - ai_idol_storage:/app/storage
  depends_on:
    mongodb:
      condition: service_healthy
    chromadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - skinsyntax-net

services:

  mongodb:
    image: mongo:7
    container_name: skinsyntax-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: skinsyntax
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "localhost:27017/test", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s
    networks:
      - skinsyntax-net

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: skinsyntax-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skinsyntax-net

  redis:
    image: redis:7-alpine
    container_name: skinsyntax-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skinsyntax-net

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: skinsyntax-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      CHATBOT_PORT: "5001"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_WORKER_CLASS: "sync"
      CHROMA_DB_PATH: /app/chroma_data
      CSV_FILE_PATH: /app/database/data_clean_final.csv
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-skinsyntax}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "604800"
      SESSION_CACHE_TTL: "3600"
      PYTHONPATH: "/app:/app/chatbot_service"
    volumes:
      - ./database:/app/database:ro
      - ./ai-service-flask:/app
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - skinsyntax-net

  ai-idol-agent-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-idol-agent
    image: skinsyntax-ai-idol-agent:local
    container_name: skinsyntax-ai-idol-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_IDOL_CREW_PORT: "5013"
      AI_IDOL_GROQ_MODEL: "${AI_IDOL_GROQ_MODEL:-openai/gpt-oss-20b}"
      AI_IDOL_CREW_REVIEW_MODEL: "${AI_IDOL_CREW_REVIEW_MODEL:-openai/gpt-oss-20b}"
      AI_IDOL_CREW_MAX_TOKENS: "${AI_IDOL_CREW_MAX_TOKENS:-650}"
      AI_IDOL_CREW_MAX_RPM: "${AI_IDOL_CREW_MAX_RPM:-4}"
      AI_IDOL_INTERNAL_TOKEN: "${AI_IDOL_INTERNAL_TOKEN:-}"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5013/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - skinsyntax-net

  ai-idol-service:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol
    ports:
      - "5003:5003"
    command: ["gunicorn", "--bind", "0.0.0.0:5003", "--workers", "1", "--threads", "4", "--timeout", "120", "app:app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s

  ai-idol-worker:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-worker
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=celery,agent,llm,gpu,media"]

  ai-idol-broadcast-worker:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-broadcast
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=broadcast"]

  ai-idol-beat:
    <<: *ai-idol-common
    container_name: skinsyntax-ai-idol-beat
    command: ["celery", "-A", "celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/ai-idol-celerybeat-schedule"]

  php-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: skinsyntax-php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-skinsyntax}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-skinsyntax}
      DB_MODE: ${DB_MODE:-atlas}
      DOCKER_USE_ATLAS: "1"
      FRONTEND_ROOT: /var/www/frontend
      APP_URL: http://localhost
      AI_CHAT_ENDPOINT: http://ai-service:5001/api/chat/auto
      AI_CHAT_STREAM_ENDPOINT: http://ai-service:5001/api/chat/stream
      AI_RECOMMENDATION_ENDPOINT: http://ai-service:5001/api/recommend/explain
      AI_HYBRID_RECOMMENDATION_ENDPOINT: http://ai-service:5001/api/recommend/langchain-rag
      AI_CHAT_TIMEOUT: "60"
      AI_RECOMMENDATION_TIMEOUT: "20"
      AI_HYBRID_RECOMMENDATION_TIMEOUT: "30"
      AI_IDOL_ENDPOINT: http://ai-idol-service:5003
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: "604800"
      MAIL_DEMO_MODE: "1"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/frontend:ro
      - ./database:/var/www/database:ro
      - ./.env:/var/www/.env:ro
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started
      ai-idol-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skinsyntax-net

  nginx:
    image: nginx:1.27-alpine
    container_name: skinsyntax-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/var/www/html/public:ro
      - uploads_data:/var/www/html/public/uploads:ro
    depends_on:
      - php-backend
    networks:
      - skinsyntax-net

  voice-service:
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    container_name: skinsyntax-voice
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      TTS_PORT: "5002"
      NUM_THREADS: "4"
      PRECISION: "int8"
    volumes:
      - vieneu_model_cache:/root/.cache/huggingface
    networks:
      - skinsyntax-net

  livekit-voice-agent:
    build:
      context: ./livekit-voice-agent
      dockerfile: Dockerfile
    container_name: skinsyntax-livekit-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      AI_SERVICE_URL: http://ai-service:5001/api/chat/auto
      TTS_SERVICE_URL: http://voice-service:5002/api/tts/stream
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - voice-service
      - ai-service
      - redis
    networks:
      - skinsyntax-net

volumes:
  mongo_data:
    name: skinsyntax-mongo-data
  chroma_data:
    name: skinsyntax-chroma-data
  uploads_data:
    name: skinsyntax-uploads
  redis_data:
    name: skinsyntax-redis-data
  vieneu_model_cache:
    name: skinsyntax-vieneu-model-cache
  ai_idol_storage:
    name: skinsyntax-ai-idol-storage

networks:
  skinsyntax-net:
    name: skinsyntax-network
    driver: bridge

