; More PHP-FPM workers: admin and live-filter requests wait on Atlas (~50 ms per round trip),
; so the default 5 workers queue up when several tabs type-search at once.
; Workers are kept alive (pm = static): every new worker pays a ~750 ms Atlas handshake
; (DNS SRV + TLS + auth), and ext-mongodb reuses that connection for the worker's later requests.
; The "zz-" prefix makes this file load after www.conf and zz-docker.conf.
[www]
pm = static
pm.max_children = 20
pm.max_requests = 2000
