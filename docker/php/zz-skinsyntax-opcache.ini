; Code bind-mount từ Windows làm mỗi lần kiểm tra timestamp rất chậm (hàng trăm file PHP mỗi request
; khi cách nhau > revalidate_freq), nên chỉ kiểm tra lại mỗi 60 s.
; Sửa code xong muốn áp dụng ngay thì chạy: docker exec skinsyntax-php kill -USR2 1  (reload FPM);
; nếu không, thay đổi sẽ tự được áp dụng sau tối đa 60 s.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
realpath_cache_size=4096K
realpath_cache_ttl=600
