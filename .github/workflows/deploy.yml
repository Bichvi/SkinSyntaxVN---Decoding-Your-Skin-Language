# CI kiểm tra push/PR. Production Recommendation chỉ chạy khi dispatch thủ công.
# Secrets cần tạo ở GitHub -> Settings -> Secrets and variables -> Actions:
#   VPS_HOST         IP hoặc tên miền của VPS
#   VPS_USER         user SSH trên VPS (vd. deploy)
#   VPS_SSH_KEY      private key dành riêng cho deploy (nội dung file deploy_key)
#   VPS_KNOWN_HOSTS  host key đã đối chiếu qua nguồn tin cậy

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recommendation_base_sha256:
        description: "SHA-256 hiện tại của structured_recommendation.py trên VPS"
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Kiểm tra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Cú pháp PHP (php -l)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out="$(php -l "$f" 2>&1)" || { echo "$out"; status=1; }
          done < <(find backend frontend -name '*.php' -not -path '*/vendor/*' -print0)
          exit $status

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cú pháp Python (compileall)
        run: |
          python -m compileall -q \
            ai-service-flask ai-idol-service ai-idol-agent-service voice-service livekit-voice-agent

      - name: Cấu hình Docker Compose production
        env:
          NEO4J_PASSWORD: ci-only
          DOMAIN: example.com
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Cấu hình Agent và cú pháp script release
        env:
          NEO4J_PASSWORD: ci-only
          DOMAIN: example.invalid
          CHAT_AGENT_INTERNAL_SECRET: ci-only-internal
          CHAT_AGENT_TOKEN_SECRET: ci-only-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.web.prod.yml -f docker-compose.agent.prod.yml config --quiet
          bash -n scripts/deploy.sh

  deploy:
    name: Deploy Recommendation lên VPS
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Chuẩn bị SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Chuyển gói Recommendation đã duyệt và kiểm thử
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          EXPECTED_SHA: ${{ inputs.recommendation_base_sha256 }}
        run: |
          set -euo pipefail
          [[ $EXPECTED_SHA =~ ^[a-f0-9]{64}$ ]]
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30)
          remote="$VPS_USER@$VPS_HOST"
          local_dir=$(mktemp -d)
          path=ai-service-flask/structured_recommendation.py
          git archive "$GITHUB_SHA" -- "$path" | tar -xO "$path" > "$local_dir/structured_recommendation.py"
          (cd "$local_dir" && sha256sum structured_recommendation.py > candidate.sha256)
          stage=$(ssh "${opts[@]}" "$remote" 'mktemp -d /tmp/skinsyntax-release.XXXXXXXX')
          [[ $stage =~ ^/tmp/skinsyntax-release\.[A-Za-z0-9]+$ ]]
          scp "${opts[@]}" "$local_dir/structured_recommendation.py" "$local_dir/candidate.sha256" "$remote:$stage/"
          ssh "${opts[@]}" "$remote" "bash -s -- '$stage' '$EXPECTED_SHA'" < scripts/deploy.sh
