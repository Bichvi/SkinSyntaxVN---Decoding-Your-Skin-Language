# Chỉ nạp khi chạy production (docker-compose.prod.yml mount thư mục này vào /etc/nginx/proxy.d).
# nginx đứng sau Caddy trong mạng Docker: lấy IP thật của khách từ X-Forwarded-For do Caddy ghi,
# để RateLimiter và log thấy đúng IP thay vì IP nội bộ của Caddy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
