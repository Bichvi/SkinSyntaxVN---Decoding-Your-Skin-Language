  CACHE_DRIVER: redis
  DB_MODE: local
  DOCKER_USE_ATLAS: "0"
  MONGO_URI: mongodb://mongodb:27017
  VALKEY_URL: redis://redis:6379/0
x-offline-ai:
  APP_URL: http://localhost:${SKINSYNTAX_LOCAL_WEB_PORT:-8080}
  CACHE_DRIVER: redis
  DB_MODE: local
  DOCKER_USE_ATLAS: "0"
  HF_HUB_OFFLINE: "1"
  MONGO_URI: mongodb://mongodb:27017
  TRANSFORMERS_OFFLINE: "1"
  VALKEY_URL: redis://redis:6379/0
